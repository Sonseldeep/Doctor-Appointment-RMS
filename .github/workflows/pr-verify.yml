name: Pr Verify

on:
  pull_request:
    branches:
      - develop
      - main

jobs:
  build:
    name: PR Verify
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          

               
      - name: Build with dotnet
        run: dotnet build --configuration Release --no-restore

